<svg xmlns="http://www.w3.org/2000/svg" width="900" height="138" viewBox="0 0 900 138" role="img" aria-label="Waviness scale with swimmable, take precautions and have fun, and avoid the sea zones">
  <defs>
    <linearGradient id="waviness" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2eaa62"/>
      <stop offset="34%" stop-color="#e3d84b"/>
      <stop offset="67%" stop-color="#f19336"/>
      <stop offset="100%" stop-color="#d94a45"/>
    </linearGradient>
  </defs>
  <text x="16" y="16" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="700">WAVINESS SCORE</text>
  <rect x="16" y="23" width="868" height="18" rx="9" fill="url(#waviness)"/>
  <g fill="#333" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <text x="190" y="36">SWIMMABLE</text>
    <text x="480" y="36">HAVE FUN · TAKE PRECAUTIONS</text>
    <text x="754" y="36">AVOID THE SEA</text>
  </g>
  <g stroke="#fff" stroke-width="2">
    <line x1="16" y1="21" x2="16" y2="43"/>
    <line x1="320" y1="21" x2="320" y2="43"/>
    <line x1="624" y1="21" x2="624" y2="43"/>
    <line x1="884" y1="21" x2="884" y2="43"/>
  </g>
  <g fill="#333" font-family="Arial, sans-serif" font-size="11">
    <text x="16" y="61" font-weight="700">0–0.25</text>
    <text x="16" y="77">Very calm</text>
    <text x="16" y="93">You can observe fish</text>
    <text x="16" y="109">and the sea floor.</text>

    <text x="320" y="61" text-anchor="middle" font-weight="700">0.3–0.4</text>
    <text x="320" y="77" text-anchor="middle">Fun waves</text>

    <text x="624" y="61" text-anchor="middle" font-weight="700">Around 0.7</text>
    <text x="624" y="77" text-anchor="middle">Avoid the sea</text>

    <text x="884" y="61" text-anchor="end" font-weight="700">1</text>
    <text x="884" y="77" text-anchor="end">Very wavy; dangerous</text>
    <text x="884" y="93" text-anchor="end">for swimming</text>
  </g>
</svg>
